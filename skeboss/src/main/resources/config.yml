# ske.bbmodel 기준 설정 (model-id: ske, model_identifier: ske)
model-id: ske

# ske 모델 facing 보정 (반대 보면 0 ↔ 180)
yaw-offset: 180
face-yaw-offset: 180
# 스킬 시전 시 모델 방향 (attack 애니는 보통 0, 반대면 180)
skill-face-yaw-offset: 0
# 스킬 위·아래 조준 각도 제한 (도)
skill-max-pitch: 75

blend-in: 0.15
blend-out: 0.25

# idle 애니 없음 → 가만히 있을 때는 애니 재생 안 함 (walk 루프 유지)
animations:
  idle: none
  walk: walk

boss:
  max-health: 400.0
  display-name: "&c&l인조인간"
  follow-range: 32.0
  melee-range: 3.5
  melee-damage: 8.0
  movement-speed: 0.38
  fire-immune: true
  ai-interval-ticks: 5
  spawn-delay-ticks: 2
  hide-base-entity: true
  viewer-sync-radius: 64.0
  model-scale: 2.0
  hitbox-scale: 2.0
  # aggro = 보스를 공격한 플레이어만 추적 / nearest = 가까운 플레이어
  target-mode: aggro
  # 스킬 조준: aggro | nearest (nearest = 어그로 없어도 스킬 사용)
  skill-target-mode: aggro
  aggro-drop-seconds: 30
  # Skript {공격력::%uuid%} 연동 — 빔 데미지 = 공격력 × beam-attack-multiplier
  rpg:
    skript-attack-variable: "공격력"
    beam-attack-multiplier: 2.0
    fallback-attack-stat: 80.0

# attack_laser: loop=hold, length=2.5초 → 끝나면 코드에서 walk(idle)로 강제 복귀
skills:
  chain:
    chain: true
    animation: walk
    cooldown-seconds: 12
    duration-ticks: 45
    damage: 6.0
    range: 16.0
    min-range: 4.0
    priority: 20
    fire-delay-ticks: 8
    chain-speed: 1.1
    hit-radius: 1.4
    pull-speed: 0.5
    pull-ticks: 14
  laser:
    animation: attack_laser
    beam: true
    cooldown-seconds: 10
    duration-ticks: 50
    damage: 18.0
    range: 20.0
    min-range: 6.0
    priority: 10
    knockback: 0.6
    aoe-radius: 0.0
    beam-width: 1.8
    fire-delay-ticks: 11
    particle-ticks: 25
    damage-interval-ticks: 4
    particle-step: 0.25
    particle-size: 2.0

# 인조인간 스킬 무기 — 플러그인이 아이템 이름·우클릭 처리 (OP 불필요)
# pvp: true = 플레이어에게도 레이저·사슬 적용
weapons:
  plugin-right-click: true
  # 인조 무기 레이저: Skript {공격력} × 배율 + 고정 데미지
  beam-attack-multiplier: 2.0
  beam-base-damage: 3.0
  # true = /skeboss weapon 으로 받은 무기(NBT)만 우클릭 인식 — 불꽃검기 등 다른 스킬과 충돌 방지
  require-nbt: true
  # untitled 불꽃검기: 손 아이템이 검기로 바뀌면 복구
  restore-after-skill: true
  # 인조인간 보스 근처 — 일반 검·무기도 백업 (보스전 불꽃검기 버그)
  restore-near-boss: true
  restore-radius: 48.0
  restore-keywords:
    - "검기"
    - "불꽃"
  pvp: true
  target-boss: true
  target-mobs: true
  artificial-arm:
    material: BLAZE_ROD
    display-name: "&c&l인조 무기"
    lore:
      - "&7인조인간의 전투 장비"
      - "&e우클릭 &7- 레이저"
      - "&e웅크린 채 우클릭 &7- 사슬"
    skill: laser
    sneak-skill: chain
    cooldown-seconds: 8
  laser-rifle:
    material: BLAZE_ROD
    display-name: "&c&l인조 레이저"
    lore:
      - "&7인조인간의 레이저 기술"
      - "&7우클릭: 레이저 발사"
      - "&7데미지: {공격력} ×2 + 3"
    skill: laser
    cooldown-seconds: 8
  chain-hook:
    material: FISHING_ROD
    display-name: "&7&l인조 사슬"
    lore:
      - "&7인조인간의 사슬 기술"
      - "&7우클릭: 사슬 발사·끌어오기"
    skill: chain
    cooldown-seconds: 10

# EMP4348 잡몹 — ModelEngine player limb 모델 + 스킨 (model-id: player_model)
minion:
  model-id: player_model
  model-fallback-ids:
    - player_model
    - skin_2
    - skin
    - player
  display-name: "&7EMP4348"
  skin-username: "EMP4348"
  skript-tag: "EMP4348"
  max-health: 20.0
  movement-speed: 0.32
  follow-range: 24.0
  melee-range: 2.5
  melee-damage: 4.0
  fire-immune: true
  # true면 스킨 적용 성공 후에만 좀비 숨김 (모델 없을 때 투명 방지)
  hide-base-entity: true
  model-scale: 1.0
  hitbox-scale: 1.0
  viewer-sync-radius: 48.0
  spawn-delay-ticks: 2
  ai-interval-ticks: 5
  spawner-respawn-seconds: 30
  boss-bar:
    enabled: true
    color: YELLOW
    style: SEGMENTED_6
  walk-animation: walk
  blend-in: 0.15
  blend-out: 0.25
  rpg:
    skript-attack-variable: "공격력"
    skript-defense-variable: "방어력"
    fallback-attack: 5.0
    fallback-defense: 0.0
