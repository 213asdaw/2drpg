# ske.bbmodel 기준 설정 (model-id: ske, model_identifier: ske)
model-id: ske

# bbmodel 애니메이션: walk, attack_laser (idle 없음 → 대기 시 walk 사용)
animations:
  idle: walk
  walk: walk

# right_arm bone이 Y -180° — 모델 facing 보정
yaw-offset: 180

blend-in: 0.15
blend-out: 0.25

boss:
  max-health: 500.0
  display-name: "&c&l☠ 해골 보스"
  follow-range: 32.0
  melee-range: 3.5
  melee-damage: 8.0
  ai-interval-ticks: 5

# attack_laser: loop=hold, length=2.5초 → 끝나면 코드에서 walk(idle)로 강제 복귀
skills:
  laser:
    animation: attack_laser
    cooldown-seconds: 10
    duration-ticks: 50
    damage: 18.0
    range: 12.0
    knockback: 0.6
    aoe-radius: 0.0
