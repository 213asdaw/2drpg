# ske.bbmodel 기준 설정 (model-id: ske, model_identifier: ske)
model-id: ske

# 모델 facing — 반대 보이면 0 ↔ 180 조절
yaw-offset: 0

blend-in: 0.15
blend-out: 0.25

# idle 애니 없음 → 가만히 있을 때는 애니 재생 안 함 (walk 루프 유지)
animations:
  idle: none
  walk: walk

boss:
  max-health: 500.0
  display-name: "&c&l☠ 해골 보스"
  follow-range: 32.0
  melee-range: 3.5
  melee-damage: 8.0
  movement-speed: 0.28
  ai-interval-ticks: 5
  spawn-delay-ticks: 2
  hide-base-entity: true
  viewer-sync-radius: 64.0
  model-scale: 2.0
  hitbox-scale: 2.0

# attack_laser: loop=hold, length=2.5초 → 끝나면 코드에서 walk(idle)로 강제 복귀
skills:
  laser:
    animation: attack_laser
    beam: true
    cooldown-seconds: 10
    duration-ticks: 50
    damage: 18.0
    range: 20.0
    knockback: 0.6
    aoe-radius: 0.0
    beam-width: 1.2
    fire-delay-ticks: 11
    particle-ticks: 20
    particle-step: 0.35
    particle-size: 1.5
