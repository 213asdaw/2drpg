# Blockbench → ModelEngine export 한 모델 ID (plugins/ModelEngine/blueprints/ 폴더 이름)
model-id: ske_boss

# idle / skill 애니메이션 이름 (모델 bbmodel 안 이름과 동일해야 함)
animations:
  idle: idle
  skill: skill_attack

# 모델이 180도 뒤집혀 보이면 true (대부분의 커스텀 모델은 false)
yaw-offset: 180

# 애니메이션 블렌드 시간 (초)
blend-in: 0.15
blend-out: 0.25

boss:
  max-health: 500.0
  display-name: "&c&l해골 보스"
