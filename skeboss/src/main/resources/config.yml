# ske.bbmodel 기준 설정 (model-id: ske, model_identifier: ske)
model-id: ske

# ske 모델 facing 보정 (반대 보면 0 ↔ 180)
yaw-offset: 180
face-yaw-offset: 180

blend-in: 0.15
blend-out: 0.25

# idle 애니 없음 → 가만히 있을 때는 애니 재생 안 함 (walk 루프 유지)
animations:
  idle: none
  walk: walk

boss:
  max-health: 500.0
  display-name: "&c&l인조인간"
  follow-range: 32.0
  melee-range: 3.5
  melee-damage: 8.0
  movement-speed: 0.28
  ai-interval-ticks: 5
  spawn-delay-ticks: 2
  hide-base-entity: true
  viewer-sync-radius: 64.0
  model-scale: 2.0
  hitbox-scale: 2.0
  # aggro = 보스를 공격한 플레이어만 타겟 / nearest = 가장 가까운 플레이어
  target-mode: aggro
  aggro-drop-seconds: 30
  # Skript {공격력::%uuid%} 연동 — 빔 데미지 = 공격력 × beam-attack-multiplier
  rpg:
    skript-attack-variable: "공격력"
    beam-attack-multiplier: 2.0
    fallback-attack-stat: 80.0

# attack_laser: loop=hold, length=2.5초 → 끝나면 코드에서 walk(idle)로 강제 복귀
skills:
  chain:
    chain: true
    animation: walk
    cooldown-seconds: 12
    duration-ticks: 45
    damage: 6.0
    range: 16.0
    min-range: 4.0
    priority: 20
    fire-delay-ticks: 8
    chain-speed: 1.1
    hit-radius: 1.4
    pull-speed: 0.5
    pull-ticks: 14
  laser:
    animation: attack_laser
    beam: true
    cooldown-seconds: 10
    duration-ticks: 50
    damage: 18.0
    range: 20.0
    min-range: 6.0
    priority: 10
    knockback: 0.6
    aoe-radius: 0.0
    beam-width: 1.2
    fire-delay-ticks: 11
    particle-ticks: 25
    particle-step: 0.25
    particle-size: 2.0
