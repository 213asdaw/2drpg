<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>빛바랜 숲의 방치 용사</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-panel">
        <div class="eyebrow">2D Idle RPG</div>
        <h1>빛바랜 숲의 방치 용사</h1>
        <p>
          용사는 자동으로 전투를 이어갑니다. 골드를 모아 능력치를 강화하고,
          더 깊은 숲의 스테이지로 진입하세요.
        </p>
        <div class="quick-stats">
          <div>
            <span>스테이지</span>
            <strong id="stageValue">1</strong>
          </div>
          <div>
            <span>레벨</span>
            <strong id="levelValue">1</strong>
          </div>
          <div>
            <span>골드</span>
            <strong id="goldValue">0</strong>
          </div>
        </div>
      </section>

      <section class="game-card">
        <div class="canvas-wrap">
          <canvas id="battleCanvas" width="960" height="540" aria-label="2D RPG battle field"></canvas>
          <button id="manualStrikeButton" class="strike-button" type="button">
            직접 공격
          </button>
        </div>

        <div class="combat-hud">
          <article>
            <div class="hud-label">
              <span>용사 HP</span>
              <strong id="heroHpText">100 / 100</strong>
            </div>
            <div class="bar">
              <span id="heroHpBar" class="bar-fill hp"></span>
            </div>
          </article>
          <article>
            <div class="hud-label">
              <span id="enemyName">슬라임</span>
              <strong id="enemyHpText">40 / 40</strong>
            </div>
            <div class="bar">
              <span id="enemyHpBar" class="bar-fill enemy"></span>
            </div>
          </article>
          <article>
            <div class="hud-label">
              <span>경험치</span>
              <strong id="xpText">0 / 20</strong>
            </div>
            <div class="bar">
              <span id="xpBar" class="bar-fill xp"></span>
            </div>
          </article>
        </div>
      </section>

      <section class="side-grid">
        <article class="panel">
          <h2>능력치</h2>
          <dl class="stat-list">
            <div>
              <dt>공격력</dt>
              <dd id="attackValue">8</dd>
            </div>
            <div>
              <dt>초당 회복</dt>
              <dd id="regenValue">1</dd>
            </div>
            <div>
              <dt>치명타</dt>
              <dd id="critValue">5%</dd>
            </div>
            <div>
              <dt>처치 수</dt>
              <dd id="killsValue">0</dd>
            </div>
          </dl>
        </article>

        <article class="panel">
          <h2>강화</h2>
          <div id="upgradeList" class="upgrade-list"></div>
        </article>

        <article class="panel log-panel">
          <h2>전투 기록</h2>
          <ol id="battleLog" class="battle-log"></ol>
        </article>
      </section>
    </main>

    <div id="offlineToast" class="offline-toast" role="status" aria-live="polite"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
